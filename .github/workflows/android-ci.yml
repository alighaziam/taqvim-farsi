name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taqvim-android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 17 / Gradle 8.13 / Android SDK 36
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle -p TaqvimFarsi --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle -p TaqvimFarsi --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taqvim-farsi-debug-apk
          path: TaqvimFarsi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
